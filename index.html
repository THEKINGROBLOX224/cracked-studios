
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cracked Studios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0915;
            color: white;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            border-bottom: 1px solid #292033;
        }

        .logo {
            color: #a855f7;
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
        }

        .hero {
            text-align: center;
            padding: 130px 20px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 18px;
        }

        .hero h1 span {
            color: #a855f7;
        }

        .hero p {
            color: #aaa;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #9333ea;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Cracked Studios</div>
        <div>
            <a href="#">Home</a>
            <a href="#">Executors</a>
            <a href="#">Login</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Welcome to <span>Cracked Studios</span></h1>
        <p>Your hub for discovering software and community projects.</p>
        <a href="#" class="btn">Explore Software</a>
    </section>

</body>
</html>
